<svg xmlns="http://www.w3.org/2000/svg" width="700" height="90" viewBox="0 0 700 90" role="img" aria-label="Offensive Cybersecurity, Full Stack Engineering, AI Engineering and Red Team">
  <defs>
    <clipPath id="c0"><rect x="40" y="15" height="60" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.1;0.28;0.32;1" values="0;450;450;0;0"/>
    </rect></clipPath>
    <clipPath id="c1"><rect x="40" y="15" height="60" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.333;0.433;0.613;0.653;1" values="0;0;432;432;0;0"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="40" y="15" height="60" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.666;0.766;0.946;0.986;1" values="0;0;486;486;0;0"/>
    </rect></clipPath>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#00ff88" filter="url(#glow)">
    <text x="40" y="55" clip-path="url(#c0)" xml:space="preserve">$ Offensive Cybersecurity</text>
    <text x="40" y="55" clip-path="url(#c1)" xml:space="preserve">$ Full Stack Engineering</text>
    <text x="40" y="55" clip-path="url(#c2)" xml:space="preserve">$ AI Engineering &amp; Red Team</text>
  </g>
  <rect y="24" width="12" height="40" fill="#00ff88" x="40">
    <animate attributeName="x" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.1;0.28;0.32;0.333;0.433;0.613;0.653;0.666;0.766;0.946;0.986;1"
      values="40;490;490;40;40;472;472;40;40;526;526;40;40"/>
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1"/>
  </rect>
</svg>
